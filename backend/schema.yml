openapi: 3.0.3
info:
  title: Flight Management API
  version: 1.0.0
  description: API documentation for the Flight Management System
paths:
  /api/analytics/flight-occupancy/:
    get:
      operationId: analytics_flight_occupancy_list
      description: Returns occupancy statistics (booked_seats / total_seats) for the
        top N most-booked flights.
      summary: Flight Occupancy
      parameters:
      - in: query
        name: top
        schema:
          type: integer
        description: 'Number of flights to return (default: 20)'
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlightOccupancy'
          description: ''
  /api/analytics/monthly-revenue/:
    get:
      operationId: analytics_monthly_revenue_list
      description: Returns revenue grouped by calendar month for the last 12 months.
      summary: Monthly Revenue
      parameters:
      - in: query
        name: months
        schema:
          type: integer
        description: 'Number of past months to include (default: 12)'
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyRevenue'
          description: ''
  /api/analytics/peak-booking-hours/:
    get:
      operationId: analytics_peak_booking_hours_list
      description: Returns the number of bookings made during each hour of the day
        (UTC). All 24 hours are always returned; hours with no bookings show 0.
      summary: Peak Booking Hours
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeakBookingHour'
          description: ''
  /api/analytics/popular-routes/:
    get:
      operationId: analytics_popular_routes_list
      description: Returns the top N routes ordered by number of confirmed bookings.
      summary: Popular Routes
      parameters:
      - in: query
        name: top
        schema:
          type: integer
        description: 'Number of top routes to return (default: 10)'
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopularRoute'
          description: ''
  /api/analytics/summary/:
    get:
      operationId: analytics_summary_retrieve
      description: 'Returns aggregated summary statistics: total revenue from confirmed
        bookings, total booking count, confirmed/cancelled breakdown, and cancellation
        rate.'
      summary: Booking Analytics Summary
      tags:
      - Analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryStats'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
  /api/auth/email/request-otp/:
    post:
      operationId: auth_email_request_otp_create
      description: Send a 6-digit OTP to the user's *new* email address to verify
        ownership.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestEmailOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestEmailOTPRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEmailOTPResponse'
          description: ''
  /api/auth/email/verify-otp/:
    post:
      operationId: auth_email_verify_otp_create
      description: Verify the OTP and update the user's email address.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailOTPRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailOTPResponse'
          description: ''
  /api/auth/google-login/:
    post:
      operationId: auth_google_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleLoginResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Custom token view that ensures a Profile exists for authenticated
