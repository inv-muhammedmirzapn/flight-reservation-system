  /api/bulk-upload/import/:
    post:
      operationId: bulk_upload_import_create
      description: |-
        POST /api/bulk-upload/import/
        Multipart form fields:
          - entity  (string): one of ENTITY_IMPORTERS keys, or "all"
          - file    (file):   .csv / .xls / .xlsx  — or .zip when entity is "all"
      tags:
      - bulk-upload
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/flights/:
    get:
      operationId: flights_list
      tags:
      - flights
      security:
