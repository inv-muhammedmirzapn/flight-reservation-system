      description: Retrieves details of a specific waitlist entry.
      summary: Waitlist Entry Details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Waitlist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
          description: ''
  /api/waitlist/{id}/cancel/:
    post:
      operationId: waitlist_cancel_create
      description: Cancels a pending waitlist entry and returns refund details.
      summary: Cancel Waitlist Entry
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Waitlist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistCancelResponse'
          description: ''
  /api/waitlist/{id}/promote/:
    post:
      operationId: waitlist_promote_create
      description: Manually promotes a pending waitlist entry to a confirmed booking.
        Admin only.
      summary: Promote Waitlist Entry
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Waitlist
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistPromoteResponse'
          description: ''
  /api/waitlist/flight/{flight_id}/:
    get:
      operationId: waitlist_flight_retrieve
      description: Returns the total number of passengers currently on the waitlist
        (pending) for a specific flight.
      summary: Waitlist Flight Count
      parameters:
      - in: path
        name: flight_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Waitlist
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistCountResponse'
          description: ''
  /api/waitlist/join/:
    post:
      operationId: waitlist_join_create
      description: |-
        POST /api/waitlist/join/
        Joins the waitlist for a flight if it is full.
        Permission: IsAuthenticated.
      tags:
      - Waitlist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistJoinRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WaitlistJoinRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WaitlistJoinRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistEntry'
          description: ''
components:
  schemas:
    Aircraft:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        registration:
          type: string
          maxLength: 20
        airline:
          type: integer
        airline_name:
          type: string
          readOnly: true
        aircraft_model:
          type: integer
        model_display:
          type: string
          readOnly: true
        economy_capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        business_capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        first_class_capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - aircraft_model
      - airline
      - airline_name
      - id
      - model_display
      - registration
    AircraftModel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        manufacturer:
          type: string
          maxLength: 100
        model_name:
          type: string
          maxLength: 100
      required:
      - id
      - manufacturer
      - model_name
    Airline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        iata_airline_code:
          type: string
          maxLength: 2
        airline_name:
          type: string
          maxLength: 200
      required:
      - airline_name
      - iata_airline_code
      - id
    Airport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        iata_code:
          type: string
          maxLength: 3
        airport_name:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        timezone:
          type: string
          maxLength: 100
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        country:
          type: integer
        country_name:
          type: string
          readOnly: true
        terminals: {}
      required:
      - airport_name
      - city
      - country
      - country_name
      - iata_code
      - id
    BlankEnum:
      enum:
      - ''
    Booking:
      type: object
      description: Full booking representation including nested flight instance summary.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        flight_id_input:
          type: integer
          writeOnly: true
        flight_detail:
          allOf:
          - $ref: '#/components/schemas/FlightInstanceSummary'
          readOnly: true
        cabin_class:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CabinClassFbfEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        seat_count:
          type: integer
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/Passenger'
          readOnly: true
      required:
      - created_at
      - flight_detail
      - flight_id_input
      - id
      - passengers
      - seat_count
      - status
      - total_price
    BookingCreateRequest:
      type: object
      properties:
        flight:
          type: integer
        cabin_class:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/CabinClass6adEnum'
          - $ref: '#/components/schemas/NullEnum'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/BookingPassengerRequest'
      required:
      - flight
      - passengers
    BookingPassengerRequest:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        gender:
          $ref: '#/components/schemas/Gender521Enum'
        phone_number:
          type: string
      required:
      - age
      - gender
      - name
    BookingStatusEnum:
      enum:
      - CONFIRMED
      - CANCELLED
      type: string
      description: |-
        * `CONFIRMED` - Confirmed
        * `CANCELLED` - Cancelled
    CabinClass6adEnum:
      enum:
      - ECONOMY
      - BUSINESS
      - FIRST
      type: string
      description: |-
        * `ECONOMY` - ECONOMY
        * `BUSINESS` - BUSINESS
        * `FIRST` - FIRST
    CabinClassFbfEnum:
      enum:
      - ECONOMY
      - BUSINESS
      - FIRST
      type: string
      description: |-
        * `ECONOMY` - Economy
        * `BUSINESS` - Business
        * `FIRST` - First
