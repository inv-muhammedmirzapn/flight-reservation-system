<style>
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0px 20px 40px rgba(0,0,0,0.04);
        }
        .input-glass {
            background-color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .input-glass:focus-within {
            background-color: rgba(255, 255, 255, 0.9);
            border-color: rgba(0, 0, 0, 0.3);
        }
        /* Floating label styles */
        .floating-label-container {
            position: relative;
        }
        .floating-input {
            width: 100%;
            padding: 24px 16px 8px 16px;
            background: transparent;
            border: none;
            outline: none;
            font-family: inherit;
        }
        .floating-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #646464; /* text-on-secondary-container */
            transition: all 0.2s ease;
            pointer-events: none;
        }
        .floating-input:focus ~ .floating-label,
        .floating-input:not(:placeholder-shown) ~ .floating-label {
            top: 12px;
            font-size: 12px;
            font-weight: 600;
            color: #1a1c1d; /* text-on-surface */
        }
    </style>

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col antialiased">
<!-- TopNavBar -->
<header class="bg-white/70 backdrop-blur-[30px] w-full sticky top-0 z-50 border-b border-white/40 shadow-[0px_20px_40px_rgba(0,0,0,0.04)] flex justify-between items-center h-20 px-lg max-w-container-max mx-auto">
<a class="font-headline-lg text-headline-lg text-on-surface tracking-tighter" href="#">
            AeroGlass
        </a>
<nav class="hidden md:flex items-center gap-md font-display-bold text-display-bold">
<a class="text-on-surface-variant hover:text-primary transition-all duration-300 active:scale-95" href="#">Explore</a>
<a class="text-on-surface-variant hover:text-primary transition-all duration-300 active:scale-95" href="#">Bookings</a>
<a class="text-on-surface-variant hover:text-primary transition-all duration-300 active:scale-95" href="#">Rewards</a>
<a class="text-on-surface-variant hover:text-primary transition-all duration-300 active:scale-95" href="#">Support</a>
</nav>
<div class="hidden md:flex items-center gap-sm">
<button class="font-display-bold text-display-bold text-on-surface-variant hover:text-primary transition-all duration-300 active:scale-95 px-4 py-2">
                Sign In
            </button>
<button class="font-display-bold text-display-bold bg-on-surface text-on-tertiary rounded-xl px-6 py-2 hover:bg-inverse-surface transition-all duration-300 active:scale-95">
                Join Club
            </button>
</div>
<button class="md:hidden text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-md md:p-lg relative">
<!-- Ambient Background Glow (Optional subtle enhancement for light mode) -->
<div class="absolute inset-0 overflow-hidden pointer-events-none -z-10">
<div class="absolute top-1/4 left-1/4 w-[40vw] h-[40vw] rounded-full bg-white blur-[100px] opacity-60 mix-blend-overlay"></div>
<div class="absolute bottom-1/4 right-1/4 w-[30vw] h-[30vw] rounded-full bg-primary-container blur-[120px] opacity-10"></div>
</div>
<!-- Login Card -->
<div class="w-full max-w-[440px] glass-panel rounded-[2rem] p-lg">
<div class="text-center mb-lg">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your journey.</p>
</div>
<form class="flex flex-col gap-md">
<!-- Email Input -->
<div class="input-glass rounded-xl overflow-hidden floating-label-container">
<input class="floating-input font-body-md text-body-md text-on-surface" id="email" placeholder=" " required="" type="email"/>
<label class="floating-label font-body-md text-body-md" for="email">Email Address</label>
</div>
<!-- Password Input -->
<div class="input-glass rounded-xl overflow-hidden floating-label-container">
<input class="floating-input font-body-md text-body-md text-on-surface" id="password" placeholder=" " required="" type="password"/>
<label class="floating-label font-body-md text-body-md" for="password">Password</label>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-sm mb-sm">
<label class="flex items-center gap-xs cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 rounded border border-outline group-hover:border-primary transition-colors bg-white/50">
<input class="opacity-0 absolute inset-0 cursor-pointer peer" type="checkbox"/>
<span class="material-symbols-outlined text-[16px] text-primary opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant select-none">Remember Me</span>
</label>
<a class="font-body-sm text-body-sm text-primary font-semibold hover:text-surface-tint transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary-container font-display-bold text-display-bold py-4 rounded-xl shadow-sm hover:shadow-md hover:bg-primary-fixed transition-all duration-300 active:scale-95 flex items-center justify-center gap-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Join Club</a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface w-full py-lg mt-xl flex flex-col md:flex-row justify-between items-center px-lg max-w-container-max mx-auto gap-md border-t border-surface-container-low">
<div class="font-display-bold text-display-bold text-on-surface">
            AeroGlass
        </div>
<nav class="flex flex-wrap justify-center gap-md font-body-sm text-body-sm">
<a class="text-on-secondary-container hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="text-on-secondary-container hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="text-on-secondary-container hover:text-primary transition-colors" href="#">Cookie Policy</a>
<a class="text-on-secondary-container hover:text-primary transition-colors" href="#">Sustainability</a>
</nav>
<div class="font-body-sm text-body-sm text-on-secondary-container text-center md:text-right">
            © 2024 AeroGlass Luxury Travel. All rights reserved.
        </div>
</footer>
</body></html>
