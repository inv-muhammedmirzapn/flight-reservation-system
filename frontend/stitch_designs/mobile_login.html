<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AeroGlass - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-highest": "#e2e2e4",
                    "on-surface": "#1a1c1d",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed": "#1b1b1b",
                    "inverse-on-surface": "#f0f0f2",
                    "on-tertiary-fixed-variant": "#454747",
                    "on-primary-fixed": "#221b00",
                    "secondary-fixed": "#e2e2e2",
                    "on-secondary-fixed-variant": "#474747",
                    "on-primary-fixed-variant": "#544600",
                    "tertiary-fixed": "#e2e2e2",
                    "primary": "#705d00",
                    "surface-dim": "#d9dadc",
                    "error-container": "#ffdad6",
                    "on-secondary": "#ffffff",
                    "primary-container": "#ffd700",
                    "tertiary": "#5d5f5f",
                    "surface-bright": "#f9f9fb",
                    "primary-fixed-dim": "#e9c400",
                    "on-error-container": "#93000a",
                    "on-secondary-container": "#646464",
                    "outline-variant": "#d0c6ab",
                    "error": "#ba1a1a",
                    "on-surface-variant": "#4d4732",
                    "on-tertiary-fixed": "#1a1c1c",
                    "tertiary-fixed-dim": "#c6c6c7",
                    "secondary-fixed-dim": "#c6c6c6",
                    "on-error": "#ffffff",
                    "primary-fixed": "#ffe16d",
                    "surface-tint": "#705d00",
                    "tertiary-container": "#d9dada",
                    "surface-container": "#eeeef0",
                    "inverse-primary": "#e9c400",
                    "secondary": "#5e5e5e",
                    "outline": "#7e775f",
                    "background": "#f9f9fb",
                    "secondary-container": "#e2e2e2",
                    "surface-variant": "#e2e2e4",
                    "surface-container-low": "#f3f3f5",
                    "surface-container-high": "#e8e8ea",
                    "on-primary-container": "#705e00",
                    "surface-container-lowest": "#ffffff",
                    "on-primary": "#ffffff",
                    "surface": "#f9f9fb",
                    "on-background": "#1a1c1d",
                    "inverse-surface": "#2f3132",
                    "on-tertiary-container": "#5e5f60"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-max": "1200px",
                    "md": "24px",
                    "xs": "4px",
                    "sm": "12px",
                    "gutter": "24px",
                    "lg": "48px",
                    "xl": "80px",
                    "base": "8px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "display-bold": ["Inter"],
                    "headline-xl": ["Plus Jakarta Sans"],
                    "body-sm": ["Inter"],
                    "label-caps": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "display-bold": ["18px", {"lineHeight": "1.5", "fontWeight": "600"}],
                    "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        .glass-card {
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }
        
        .floating-label-input:focus + label,
        .floating-label-input:not(:placeholder-shown) + label {
            transform: translateY(-50%) scale(0.85);
            top: 0;
            background-color: transparent;
            padding: 0 4px;
            color: var(--color-on-surface);
        }
        
        .floating-label-label {
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 45%, #ffffff 50%, #ffffff 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-5 relative overflow-hidden antialiased">
<!-- Ambient Background Blobs to simulate depth without photos -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute top-[-5%] left-[-10%] w-[60vw] h-[60vw] bg-primary-container/20 rounded-full blur-[80px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[70vw] h-[70vw] bg-surface-variant/40 rounded-full blur-[80px]"></div>
</div>
<!-- Main Content Canvas (Navigation Shell Suppressed per Transactional Flow Rules) -->
<main class="w-full max-w-sm w-full mx-auto relative z-10">
<!-- Glassmorphic Login Card -->
<div class="bg-surface/70 glass-card border border-white/40 shadow-[0px_20px_40px_rgba(0,0,0,0.04)] rounded-lg p-[32px] flex flex-col gap-[32px]">
<!-- Branding Header -->
<div class="text-center space-y-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">AeroGlass</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Seamless travel awaits.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-[24px]">
<!-- Email Input -->
<div class="relative group">
<input class="floating-label-input w-full bg-white/40 border border-outline-variant/60 focus:border-on-surface rounded-DEFAULT px-4 py-3.5 font-body-md text-body-md text-on-surface focus:outline-none transition-all placeholder-transparent" id="email" placeholder="Email" required="" type="email"/>
<label class="floating-label-label absolute left-3 top-3.5 px-1 font-body-sm text-body-sm text-on-surface-variant transition-all pointer-events-none origin-left" for="email">Email address</label>
</div>
<!-- Password Input -->
<div class="relative group">
<input class="floating-label-input w-full bg-white/40 border border-outline-variant/60 focus:border-on-surface rounded-DEFAULT px-4 py-3.5 font-body-md text-body-md text-on-surface focus:outline-none transition-all placeholder-transparent" id="password" placeholder="Password" required="" type="password"/>
<label class="floating-label-label absolute left-3 top-3.5 px-1 font-body-sm text-body-sm text-on-surface-variant transition-all pointer-events-none origin-left" for="password">Password</label>
<button aria-label="Toggle password visibility" class="absolute right-4 top-3.5 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility" style="font-variation-settings: 'FILL' 0; font-size: 20px;">visibility</span>
</button>
</div>
<!-- Utility Links -->
<div class="flex justify-between items-center px-1">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5">
<input class="peer appearance-none w-5 h-5 border border-outline-variant rounded-sm checked:bg-on-surface checked:border-on-surface transition-colors cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" data-icon="check" style="font-size: 14px; font-variation-settings: 'wght' 600;">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-body-sm text-body-sm text-on-surface font-semibold hover:opacity-70 transition-opacity" href="#">Forgot?</a>
</div>
<!-- Primary Action -->
<button class="w-full bg-on-surface text-primary-container font-label-caps text-label-caps rounded-xl py-4 mt-2 hover:opacity-90 active:scale-95 transition-all duration-200 shadow-md flex items-center justify-center gap-2" type="submit">
                    SIGN IN
                    <span class="material-symbols-outlined" data-icon="arrow_forward" style="font-size: 16px;">arrow_forward</span>
</button>
</form>
<!-- Secondary Action -->
<div class="text-center pt-2 border-t border-outline-variant/20">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? <a class="text-on-surface font-semibold hover:underline decoration-primary decoration-2 underline-offset-4 transition-all" href="#">Create one</a>
</p>
</div>
</div>
</main>
</body></html>
