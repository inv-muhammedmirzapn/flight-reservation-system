<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.04);
        }
        .floating-input:focus-within label {
            transform: translateY(-120%) scale(0.85);
            color: theme('colors.primary');
        }
        .floating-input input:not(:placeholder-shown) + label {
            transform: translateY(-120%) scale(0.85);
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased">
<!-- TopNavBar (Suppressed for Linear/Transactional intent per logic, but explicitly requested by user prompt, so including it) -->
<nav class="bg-white/70 backdrop-blur-[30px] w-full sticky top-0 z-50 shadow-[0px_20px_40px_rgba(0,0,0,0.04)]">
<div class="flex justify-between items-center h-20 px-lg max-w-container-max mx-auto">
<div class="font-headline-lg text-headline-lg text-on-surface tracking-tighter">
                AeroGlass
            </div>
<div class="hidden md:flex gap-md font-display-bold text-display-bold">
<a class="text-on-surface-variant hover:text-primary transition-all duration-300" href="#">Explore</a>
<a class="text-on-surface-variant hover:text-primary transition-all duration-300" href="#">Bookings</a>
<a class="text-on-surface-variant hover:text-primary transition-all duration-300" href="#">Rewards</a>
<a class="text-on-surface-variant hover:text-primary transition-all duration-300" href="#">Support</a>
</div>
<div class="flex gap-sm items-center">
<button class="text-on-surface-variant font-display-bold text-display-bold hover:text-primary transition-all duration-300 hidden md:block">
                    Sign In
                </button>
<button class="bg-on-surface text-primary-container px-md py-sm rounded-xl font-display-bold text-display-bold hover:bg-surface-variant hover:text-on-surface transition-colors duration-300 active:scale-95">
                    Join Club
                </button>
</div>
</div>
</nav>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center py-xl px-md md:px-lg">
<div class="w-full max-w-[480px]">
<div class="glass-card rounded-[2rem] p-lg w-full flex flex-col gap-lg">
<div class="text-center flex flex-col gap-xs">
<h1 class="font-headline-xl text-headline-xl text-on-surface">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join AeroGlass for an elevated travel experience.</p>
</div>
<form class="flex flex-col gap-md">
<!-- Full Name -->
<div class="relative floating-input bg-white/50 border border-white/60 rounded-xl px-md py-sm focus-within:border-primary/50 transition-colors">
<input class="w-full bg-transparent border-none outline-none focus:ring-0 font-body-md text-on-surface pt-4 pb-1 z-10 relative peer" id="fullname" placeholder=" " required="" type="text"/>
<label class="absolute left-md top-1/2 -translate-y-1/2 font-body-md text-on-surface-variant transition-all duration-200 pointer-events-none origin-left" for="fullname">Full Name</label>
</div>
<!-- Email -->
<div class="relative floating-input bg-white/50 border border-white/60 rounded-xl px-md py-sm focus-within:border-primary/50 transition-colors">
<input class="w-full bg-transparent border-none outline-none focus:ring-0 font-body-md text-on-surface pt-4 pb-1 z-10 relative peer" id="email" placeholder=" " required="" type="email"/>
<label class="absolute left-md top-1/2 -translate-y-1/2 font-body-md text-on-surface-variant transition-all duration-200 pointer-events-none origin-left" for="email">Email Address</label>
</div>
<!-- Password -->
<div class="relative floating-input bg-white/50 border border-white/60 rounded-xl px-md py-sm focus-within:border-primary/50 transition-colors">
<input class="w-full bg-transparent border-none outline-none focus:ring-0 font-body-md text-on-surface pt-4 pb-1 z-10 relative peer" id="password" placeholder=" " required="" type="password"/>
<label class="absolute left-md top-1/2 -translate-y-1/2 font-body-md text-on-surface-variant transition-all duration-200 pointer-events-none origin-left" for="password">Password</label>
</div>
<!-- Confirm Password -->
<div class="relative floating-input bg-white/50 border border-white/60 rounded-xl px-md py-sm focus-within:border-primary/50 transition-colors">
<input class="w-full bg-transparent border-none outline-none focus:ring-0 font-body-md text-on-surface pt-4 pb-1 z-10 relative peer" id="confirm-password" placeholder=" " required="" type="password"/>
<label class="absolute left-md top-1/2 -translate-y-1/2 font-body-md text-on-surface-variant transition-all duration-200 pointer-events-none origin-left" for="confirm-password">Confirm Password</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-surface font-display-bold text-display-bold py-sm rounded-xl mt-sm hover:bg-[#ffe140] transition-colors duration-300 shadow-[0px_8px_16px_rgba(255,215,0,0.2)] active:scale-95 flex items-center justify-center gap-xs" type="button">
                        Create Account
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<div class="text-center font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? <a class="text-primary font-display-bold hover:underline" href="#">Sign In</a>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface w-full py-lg mt-xl border-t border-surface-container-low">
<div class="flex flex-col md:flex-row justify-between items-center px-lg max-w-container-max mx-auto gap-md">
<div class="font-display-bold text-display-bold text-on-surface">
                AeroGlass
            </div>
<div class="flex flex-wrap justify-center gap-md font-body-sm text-body-sm">
<a class="text-on-secondary-container hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="text-on-secondary-container hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="text-on-secondary-container hover:text-primary transition-colors" href="#">Cookie Policy</a>
<a class="text-on-secondary-container hover:text-primary transition-colors" href="#">Sustainability</a>
</div>
<div class="font-body-sm text-body-sm text-on-secondary-container text-center md:text-right">
                © 2024 AeroGlass Luxury Travel. All rights reserved.
            </div>
</div>
</footer>
